{% extends "app_base.html" %}
{% block title %}Registry{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <p class="eyebrow">Operators and drivers</p>
    <h1>Registry</h1>
  </div>
  <a class="btn btn-gold" href="{{ url_for('members.create') }}">Add record</a>
</header>
<form id="filters" class="panel filters" method="get" action="{{ url_for('members.index') }}">
  <div class="field">
    <label class="label" for="q">Search the registry</label>
    <input class="input" id="q" name="q" value="{{ q }}" placeholder="Body number, name, franchise, or address" autocomplete="off">
  </div>
  <div class="filter-grid">
    <div class="field">
      <label class="label" for="association">Association</label>
      <select class="input" id="association" name="association">
        <option value="">All associations</option>
        <option value="__blank__" {% if association == '__blank__' %}selected{% endif %}>No association</option>
        {% for name in associations %}
          <option value="{{ name }}" {% if association == name %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label class="label" for="kind">Driver</label>
      <select class="input" id="kind" name="kind">
        <option value="">All drivers</option>
        <option value="owner" {% if kind == 'owner' %}selected{% endif %}>Owner-drivers</option>
        <option value="hired" {% if kind == 'hired' %}selected{% endif %}>Assigned drivers</option>
      </select>
    </div>
    <div class="field">
      <label class="label" for="status">Status</label>
      <select class="input" id="status" name="status">
        <option value="">Any status</option>
        {% for item in ['Active', 'Suspended', 'Expired'] %}
          <option value="{{ item }}" {% if status == item %}selected{% endif %}>{{ item }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <input type="hidden" name="sort" value="{{ sort }}">
  <input type="hidden" name="dir" value="{{ direction }}">
  <div class="page-head" style="margin:.8rem 0 0;">
    <p class="hint">Press / to focus search.</p>
    {% if has_filter %}
      <a class="js-nav" href="{{ qurl(q=None, association=None, kind=None, status=None, page=None) }}">Clear filters</a>
    {% endif %}
  </div>
</form>
<div id="results" aria-live="polite">
  {% include "members/_table.html" %}
</div>
{% endblock %}
